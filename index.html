<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confluence Markup Preview</title>
  <script src="https://unpkg.com/@sap/konviw@latest/dist/konviw.js"></script>
</head>
<body style="font-family: Arial, sans-serif; margin: 40px;">
  <h1>Business Case Documentation Preview</h1>

  <label for="markup">Paste Confluence Markup Below:</label><br>
  <textarea id="markup" rows="15" cols="100" placeholder="Type or paste your wiki markup here">h1. Use Case: Customer Onboarding

System A pulls data from CRM
* *Inbound:* Customer profile
* *Outbound:* Verification and scoring

|| Attribute || Description ||
| Customer ID | Unique identifier |
| Name | Full legal name |</textarea>
  <br><br>

  <button onclick="renderPreview()" style="padding: 10px 20px;">Preview</button>

  <h2>Preview:</h2>
  <div style="border:1px solid #ccc; padding:20px;">
    <konviw-viewer id="konviw"></konviw-viewer>
  </div>

  <script>
    function renderPreview() {
      const markup = document.getElementById("markup").value;
      const konviw = document.getElementById("konviw");
      konviw.source = markup;
    }
  </script>
</body>
</html>
